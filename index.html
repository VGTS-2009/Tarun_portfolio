<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087e82">
  <meta name="description" content="Tarun OS: a retro desktop portfolio with work, notes, achievements, and videos.">
  <title>Tarun OS</title>
  <link rel="stylesheet" href="styles.css">
  <script src="desktop.js" defer></script>
</head>
<body>
  <section class="boot-screen" id="boot-screen" aria-label="Tarun OS startup">
    <div class="boot-panel">
      <div class="boot-panel__titlebar"><span class="boot-title-icon" aria-hidden="true">95</span><span>Tarun OS Setup</span><span class="boot-panel__version">v. 1.0</span></div>
      <div class="boot-panel__body">
        <p class="boot-kicker">PERSONAL COMPUTER</p>
        <h1>Welcome to<br><span>Tarun OS</span></h1>
        <p class="boot-message" id="boot-message">Ready when you are.</p>
        <div class="boot-progress" role="progressbar" aria-label="System startup" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="boot-progress__fill"></span></div>
        <button class="boot-button" id="boot-button" type="button">Power on</button>
      </div>
      <div class="boot-panel__footer"><span>© TARUN OS</span><span>PLEASE WAIT</span></div>
    </div>
  </section>
  <main class="desktop" aria-label="Tarun OS desktop" aria-hidden="true" inert>
    <div class="desktop-grain" aria-hidden="true"></div>
    <header class="desktop-heading">
      <span class="desktop-heading__eyebrow">PERSONAL OPERATING SYSTEM</span>
      <h1>Tarun OS<span class="heading-dot">.</span></h1>
      <p>A portfolio desktop by Tarun.</p>
    </header>

    <nav class="desktop-icons" id="desktop-icons" aria-label="Desktop applications">
      <button class="desktop-icon" type="button" data-app="about" aria-label="Open About Me">
        <span class="desktop-icon__glyph glyph-person" aria-hidden="true"><span>✳</span></span>
        <span class="desktop-icon__label">About Me</span>
      </button>
      <button class="desktop-icon" type="button" data-app="work" aria-label="Open My Work">
        <span class="desktop-icon__glyph glyph-folder" aria-hidden="true"><span>W</span></span>
        <span class="desktop-icon__label">My Work</span>
      </button>
      <button class="desktop-icon" type="button" data-app="journal" aria-label="Open Field Notes">
        <span class="desktop-icon__glyph glyph-notes" aria-hidden="true"><span>✎</span></span>
        <span class="desktop-icon__label">Field Notes</span>
      </button>
      <button class="desktop-icon" type="button" data-app="contact" aria-label="Open Get in Touch">
        <span class="desktop-icon__glyph glyph-mail" aria-hidden="true"><span>✉</span></span>
        <span class="desktop-icon__label">Get in Touch</span>
      </button>
      <button class="desktop-icon" type="button" data-app="achievements" aria-label="Open Achievements">
        <span class="desktop-icon__glyph glyph-award" aria-hidden="true"><span>★</span></span>
        <span class="desktop-icon__label">Achievements</span>
      </button>
      <button class="desktop-icon" type="button" data-app="videos" aria-label="Open Videos">
        <span class="desktop-icon__glyph glyph-video" aria-hidden="true"><span>▶</span></span>
        <span class="desktop-icon__label">Videos</span>
      </button>
    </nav>

    <div class="windows-layer" id="windows-layer" aria-live="polite"></div>

    <footer class="taskbar">
      <button class="start-button" id="start-button" type="button" aria-expanded="false" aria-controls="start-menu">
        <span>Start</span>
      </button>
      <div class="taskbar-divider" aria-hidden="true"></div>
      <div class="taskbar-apps" id="taskbar-apps" aria-label="Open applications"></div>
      <div class="system-tray"><span class="tray-status" aria-hidden="true">◉</span><time id="clock" aria-label="Current time"></time></div>
    </footer>

    <section class="start-menu" id="start-menu" aria-label="Start menu" hidden>
      <div class="start-menu__side"><span>TARUN OS</span></div>
      <div class="start-menu__items">
        <p class="start-menu__heading">Tarun OS</p>
        <button type="button" data-app="about"><span aria-hidden="true">✳</span> About Me</button>
        <button type="button" data-app="work"><span aria-hidden="true">▰</span> My Work</button>
        <button type="button" data-app="journal"><span aria-hidden="true">✎</span> Field Notes</button>
        <button type="button" data-app="contact"><span aria-hidden="true">✉</span> Get in Touch</button>
        <button type="button" data-app="achievements"><span aria-hidden="true">★</span> Achievements</button>
        <button type="button" data-app="videos"><span aria-hidden="true">▶</span> Videos</button>
        <div class="start-menu__rule"></div>
        <button type="button" data-app="settings"><span aria-hidden="true">⚙</span> Settings</button>
        <div class="start-menu__rule"></div>
        <div class="start-menu__status"><span class="status-light"></span> All systems delightful</div>
      </div>
    </section>
  </main>
</body>
</html>
